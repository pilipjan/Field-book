<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Book</title>
<style>
  :root{
    --paper:#EDE8DC;
    --card:#FBF9F3;
    --ink:#2B2620;
    --ink-soft:#5C554A;
    --line:#D8D0BF;
    --moss:#4F6B49;
    --moss-soft:#DDE6D6;
    --rust:#A8492E;
    --rust-soft:#F1DCD3;
    --shadow: 0 1px 2px rgba(43,38,32,0.08), 0 4px 14px rgba(43,38,32,0.06);
    --radius:3px;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"]{
    --paper:#1B1A16;
    --card:#252420;
    --ink:#E9E3D6;
    --ink-soft:#AFA795;
    --line:#3A382F;
    --moss:#8FAF83;
    --moss-soft:#2C3527;
    --rust:#D3785A;
    --rust-soft:#3A2A22;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  header{
    display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:10px;
  }
  header h1{font-family:var(--serif);font-size:30px;font-weight:700;margin:0;letter-spacing:0.2px;}
  header .tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-soft);}
  .hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .folder-badge{
    font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;
    border:1px solid var(--line);border-radius:20px;padding:6px 10px;
  }

  button, .btn{
    font-family:var(--sans);font-size:13px;border:1px solid var(--ink);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:var(--radius);cursor:pointer;line-height:1;
  }
  button:hover{background:var(--moss-soft);}
  button.primary{background:var(--moss);color:#fbf9f3;border-color:var(--moss);}
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{border-color:var(--line);}
  button.danger{border-color:var(--rust);color:var(--rust);background:transparent;}
  button.danger:hover{background:var(--rust-soft);}
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--moss); outline-offset:2px;
  }
  button.icon{padding:8px 10px;font-size:15px;}
  button.small{padding:5px 10px;font-size:12px;}
  button:disabled{opacity:0.5;cursor:not-allowed;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:200px;position:relative;}
  .search-box input{
    width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--card);color:var(--ink);font-size:14px;
  }
  .search-box::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
  .chip{
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    padding:5px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--ink-soft);background:var(--card);
  }
  .chip.active{background:var(--moss);color:#fbf9f3;border-color:var(--moss);}

  #list{display:flex;flex-direction:column;gap:10px;}
  .entry{
    background:var(--card);border:1px solid var(--line);border-left:4px solid var(--moss);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;position:relative;
    transition:background 0.15s ease, box-shadow 0.15s ease, border-left-color 0.15s ease, transform 0.15s ease;
  }
  .entry:hover{
    background:var(--moss-soft);border-left-color:var(--rust);
    box-shadow:0 2px 6px rgba(43,38,32,0.12), 0 10px 22px rgba(43,38,32,0.12);
    transform:translateY(-1px);
  }
  .entry-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
  .entry h3{font-family:var(--serif);font-size:18px;margin:0 0 4px;flex:1;}
  .entry .cat{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;color:var(--moss);white-space:nowrap;display:flex;align-items:center;gap:5px;}
  .cat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;}
  .pin-btn{background:transparent;border:none;padding:2px 4px;font-size:15px;line-height:1;color:var(--ink-soft);cursor:pointer;}
  .pin-btn.pinned{color:var(--rust);}
  .pin-btn:hover{background:transparent;}
  .entry .snippet{
    color:var(--ink-soft);font-size:13.5px;margin:4px 0 0;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .entry .meta-row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);}
  .kwline{font-family:var(--mono);font-size:10.5px;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:var(--serif);font-size:16px;}

  .overlay{
    display:none;position:fixed;inset:0;background:rgba(20,18,14,0.5);
    align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);max-width:680px;width:100%;padding:24px;box-shadow:var(--shadow);}
  .modal h2{font-family:var(--serif);margin:0 0 16px;font-size:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);margin-bottom:5px;}
  .field input[type=text], .field select{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:9px 10px;
    font-family:var(--sans);font-size:14px;background:var(--paper);color:var(--ink);
  }

  .block-toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
  .block-card{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;background:var(--paper);}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .block-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);}
  .block-controls{display:flex;gap:4px;}
  .block-controls button{padding:3px 7px;font-size:11px;line-height:1;}
  .block-card input[type=text], .block-card textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px 9px;
    font-family:var(--sans);font-size:13.5px;background:var(--card);color:var(--ink);resize:vertical;
  }
  .block-card textarea{min-height:64px;line-height:1.5;}
  .fmt-toolbar{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;}
  .fmt-toolbar button{padding:3px 9px;font-size:12px;line-height:1;min-width:26px;}
  .fmt-toolbar button[data-fmt="bold"]{font-weight:700;}
  .fmt-toolbar button[data-fmt="italic"]{font-style:italic;}
  .fmt-toolbar button.dot{color:#fff;border-color:transparent;width:20px;height:20px;min-width:20px;border-radius:50%;padding:0;}
  .block-card.heading input{font-family:var(--serif);font-size:17px;font-weight:700;}
  .block-empty-hint{color:var(--ink-soft);font-size:13px;text-align:center;padding:14px;border:1px dashed var(--line);border-radius:var(--radius);}

  .img-block-drop{
    border:1.5px dashed var(--line);border-radius:var(--radius);padding:14px;text-align:center;
    color:var(--ink-soft);font-size:12px;cursor:pointer;margin-bottom:8px;
  }
  .img-block-drop.drag{border-color:var(--moss);background:var(--moss-soft);}
  .img-block-preview{position:relative;display:inline-block;margin-bottom:8px;}
  .img-block-preview img{max-width:220px;max-height:160px;border:1px solid var(--line);border-radius:2px;cursor:zoom-in;display:block;}
  .img-block-preview video{max-width:260px;max-height:180px;border:1px solid var(--line);border-radius:2px;display:block;}
  .img-block-preview .rm{
    position:absolute;top:-7px;right:-7px;background:var(--rust);color:#fff;border:none;
    width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;cursor:pointer;padding:0;
  }

  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;flex-wrap:wrap;}
  .modal-actions .right{display:flex;gap:8px;}

  .detail-cat{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--moss);}
  .detail-body h3{font-family:var(--serif);margin:18px 0 6px;font-size:17px;}
  .detail-body h3:first-child{margin-top:10px;}
  .detail-body p{margin:0 0 12px;line-height:1.6;font-size:14.5px;white-space:pre-wrap;}
  .detail-body mark{background:#F5E27A;color:#2B2620;padding:0 2px;border-radius:2px;}
  .detail-body figure{margin:0 0 16px;}
  .detail-body figure img{max-width:100%;max-height:340px;object-fit:contain;border:1px solid var(--line);border-radius:2px;cursor:zoom-in;}
  .detail-body figure video{max-width:100%;max-height:400px;border:1px solid var(--line);border-radius:2px;}
  .detail-body figcaption{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .detail-meta{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;}

  .lightbox{
    display:none;position:fixed;inset:0;background:rgba(10,9,7,0.88);
    align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:20px;
  }
  .lightbox.show{display:flex;}
  .lightbox img{max-width:92vw;max-height:92vh;border-radius:2px;}

  .connect-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:40px 30px;text-align:center;margin-top:40px;
  }
  .connect-card h2{font-family:var(--serif);font-size:22px;margin:0 0 10px;}
  .connect-card p{color:var(--ink-soft);font-size:14px;max-width:420px;margin:0 auto 20px;line-height:1.5;}

  footer{margin-top:40px;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);letter-spacing:0.3px;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  @media (max-width:480px){ .entry-top{flex-direction:column;} header h1{font-size:24px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Field Book</h1>
      <div class="tag">how to fix it, where to find it — kept for next time</div>
    </div>
    <div class="hdr-actions" id="hdrActions">
      <button class="icon ghost" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
    </div>
  </header>
  <div id="mainArea"></div>
  <footer id="footerNote"></footer>
</div>

<!-- Editor Modal -->
<div class="overlay" id="editorOverlay">
  <div class="modal">
    <h2 id="editorTitle">New Entry</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label for="fTitle">Title</label>
      <input type="text" id="fTitle" placeholder="e.g. Reset the office printer's IP address">
    </div>
    <div class="field">
      <label for="fCategory">Line of business</label>
      <select id="fCategory">
        <option value="General Liability">General Liability</option>
        <option value="Professional">Professional</option>
        <option value="Workers Compensation">Workers Compensation</option>
        <option value="Auto">Auto</option>
        <option value="Property">Property</option>
        <option value="Accident">Accident</option>
        <option value="Umbrella">Umbrella</option>
        <option value="Package">Package</option>
        <option value="General / Other">General / Other</option>
      </select>
    </div>
    <div class="field">
      <label for="fKeywords">Keywords <span style="text-transform:none;letter-spacing:0;">(comma separated — city, insured name, anything else worth searching)</span></label>
      <input type="text" id="fKeywords" placeholder="e.g. Chicago, supplemental, hazard code">
    </div>
    <div class="field">
      <label>Instructions</label>
      <div class="block-toolbar">
        <button type="button" class="ghost small" id="addHeadingBtn">+ Heading</button>
        <button type="button" class="ghost small" id="addTextBtn">+ Text</button>
        <button type="button" class="ghost small" id="addImageBtn">+ Image</button>
        <button type="button" class="ghost small" id="addVideoBtn">+ Video</button>
      </div>
      <div id="blocksContainer"></div>
    </div>
    <div class="modal-actions">
      <button class="danger" id="deleteBtn" style="display:none;">Delete entry</button>
      <div class="right">
        <button class="ghost" id="cancelBtn">Cancel</button>
        <button class="primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <div class="detail-cat" id="dCategory"></div>
    <h2 id="dTitle"></h2>
    <div class="detail-body" id="dBody"></div>
    <div class="detail-cat" id="dKeywords" style="margin-top:8px;color:var(--ink-soft);"></div>
    <div class="detail-meta" id="dMeta"></div>
    <div class="modal-actions">
      <button class="ghost" id="closeDetailBtn">Close</button>
      <div class="right">
        <button class="danger" id="dDeleteBtn">Delete</button>
        <button class="ghost" id="dDuplicateBtn">Duplicate</button>
        <button class="ghost" id="dPinBtn">☆ Pin</button>
        <button class="primary" id="dEditBtn">Edit</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt="Full size screenshot"></div>

<script>
(function(){
  var THEME_KEY = 'refbank_theme';
  var entries = [];
  var dirHandle = null;
  var activeCategory = null;
  var blocks = [];             // {id, type:'heading'|'text'|'image', text, caption, blob, filename, previewUrl}
  var editingOldFiles = [];    // image filenames on disk before this edit, for cleanup
  var currentDetailId = null;
  var currentDetailObjectUrls = [];

  /* ---------- IndexedDB handle storage ---------- */
  function idbOpen(){
    return new Promise(function(res,rej){
      var req = indexedDB.open('refbank-db', 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore('handles'); };
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
  }
  function idbSet(key, val){
    return idbOpen().then(function(db){
      return new Promise(function(res,rej){
        var tx = db.transaction('handles','readwrite');
        tx.objectStore('handles').put(val, key);
        tx.oncomplete = function(){ res(); };
        tx.onerror = function(){ rej(tx.error); };
      });
    });
  }
  function idbGet(key){
    return idbOpen().then(function(db){
      return new Promise(function(res,rej){
        var tx = db.transaction('handles','readonly');
        var req = tx.objectStore('handles').get(key);
        req.onsuccess = function(){ res(req.result); };
        req.onerror = function(){ rej(req.error); };
      });
    });
  }

  function uid(){ return 'e' + Date.now() + Math.random().toString(16).slice(2,8); }
  function fmtDate(ts){ var d = new Date(ts); return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function slugify(s){
    return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'entry';
  }
  function extFor(blob, fallback){
    var t = (blob && blob.type) || '';
    if(t.indexOf('png')!==-1) return 'png';
    if(t.indexOf('jpeg')!==-1 || t.indexOf('jpg')!==-1) return 'jpg';
    if(t.indexOf('gif')!==-1) return 'gif';
    if(t.indexOf('webp')!==-1) return 'webp';
    if(t.indexOf('mp4')!==-1) return 'mp4';
    if(t.indexOf('webm')!==-1) return 'webm';
    if(t.indexOf('quicktime')!==-1) return 'mov';
    if(t.indexOf('ogg')!==-1) return 'ogv';
    return fallback || 'png';
  }
  var CATEGORY_COLORS = {
    'General Liability': '#4F6B49',
    'Professional': '#3B6E8F',
    'Workers Compensation': '#A8492E',
    'Auto': '#8B6F3E',
    'Property': '#6B4F8A',
    'Accident': '#B5546B',
    'Umbrella': '#3E8B7A',
    'Package': '#8A7F4F',
    'General / Other': '#5C554A'
  };
  var FALLBACK_PALETTE = ['#4F6B49','#3B6E8F','#A8492E','#8B6F3E','#6B4F8A','#B5546B','#3E8B7A','#8A7F4F'];
  function colorForCategory(cat){
    if(CATEGORY_COLORS[cat]) return CATEGORY_COLORS[cat];
    var h = 0;
    for(var i=0;i<(cat||'').length;i++){ h = (h*31 + cat.charCodeAt(i)) & 0xffffffff; }
    return FALLBACK_PALETTE[Math.abs(h) % FALLBACK_PALETTE.length];
  }
  function catDot(cat){
    return '<span class="cat-dot" style="background:'+colorForCategory(cat)+';"></span>';
  }

  /* ---------- Folder connection ---------- */
  async function ensurePermission(handle, requestIfNeeded){
    var opts = {mode:'readwrite'};
    var perm = await handle.queryPermission(opts);
    if(perm === 'granted') return true;
    if(requestIfNeeded){ perm = await handle.requestPermission(opts); return perm === 'granted'; }
    return false;
  }
  async function pickFolder(){
    try{
      var handle = await window.showDirectoryPicker({mode:'readwrite'});
      await idbSet('root', handle);
      dirHandle = handle;
      await afterConnect();
    }catch(e){}
  }
  async function readIndex(){
    var fh = await dirHandle.getFileHandle('index.json', {create:true});
    var file = await fh.getFile();
    var text = await file.text();
    if(!text || !text.trim()){ entries = []; return; }
    try{ entries = JSON.parse(text); }catch(e){ entries = []; }
  }
  async function writeIndex(){
    var fh = await dirHandle.getFileHandle('index.json', {create:true});
    var w = await fh.createWritable();
    await w.write(JSON.stringify(entries, null, 2));
    await w.close();
  }
  async function afterConnect(){
    await readIndex();
    renderHeaderConnected();
    renderMainConnected();
  }
  function renderHeaderConnected(){
    var actions = document.getElementById('hdrActions');
    actions.innerHTML =
      '<span class="folder-badge">📁 ' + escapeHtml(dirHandle.name) + '</span>' +
      '<button class="ghost" id="changeFolderBtn">Change folder</button>' +
      '<button class="primary" id="newBtn">+ New Entry</button>';
    document.getElementById('changeFolderBtn').onclick = pickFolder;
    document.getElementById('newBtn').onclick = function(){ openEditor(null); };
  }
  function renderMainConnected(){
    document.getElementById('footerNote').textContent =
      'Each entry lives in its own folder inside "' + dirHandle.name + '" — notes.txt plus any screenshots, right on your computer.';
    document.getElementById('mainArea').innerHTML =
      '<div class="toolbar"><div class="search-box"><input type="text" id="searchInput" placeholder="Search titles, notes, categories, keywords…"></div></div>' +
      '<div class="chips" id="chipRow"></div><div id="list"></div>';
    document.getElementById('searchInput').oninput = renderList;
    renderChips();
    renderList();
  }
  function showConnectPrompt(){
    document.getElementById('footerNote').textContent = '';
    document.getElementById('mainArea').innerHTML =
      '<div class="connect-card"><h2>Choose a folder</h2>' +
      '<p>Pick (or create) a folder on your computer. Every entry you add will get its own subfolder there, with your notes and screenshots as real files.</p>' +
      '<button class="primary" id="connectBtn">Choose folder</button></div>';
    document.getElementById('connectBtn').onclick = pickFolder;
  }
  function showReconnectPrompt(handle){
    document.getElementById('footerNote').textContent = '';
    document.getElementById('mainArea').innerHTML =
      '<div class="connect-card"><h2>Reconnect your folder</h2>' +
      '<p>Your browser needs you to confirm access to "' + escapeHtml(handle.name) + '" again this session.</p>' +
      '<button class="primary" id="reconnectBtn">Reconnect</button>' +
      '<div style="margin-top:10px;"><button class="ghost" id="pickDifferentBtn">Choose a different folder</button></div></div>';
    document.getElementById('reconnectBtn').onclick = async function(){
      var ok = await ensurePermission(handle, true);
      if(ok){ dirHandle = handle; await afterConnect(); }
    };
    document.getElementById('pickDifferentBtn').onclick = pickFolder;
  }
  function showUnsupported(){
    document.getElementById('footerNote').textContent = '';
    document.getElementById('mainArea').innerHTML =
      '<div class="connect-card"><h2>This browser can\'t save live folders</h2>' +
      '<p>Live folders need Chrome or Edge. Open this file there to connect a folder and start adding entries.</p></div>';
  }

  /* ---------- Categories / list ---------- */
  function allCategories(){
    var set = {};
    entries.forEach(function(e){ if(e.category) set[e.category]=true; });
    return Object.keys(set).sort(function(a,b){return a.localeCompare(b);});
  }
  function renderChips(){
    var row = document.getElementById('chipRow');
    if(!row) return;
    var cats = allCategories();
    row.innerHTML = '';
    if(cats.length===0) return;
    var allChip = document.createElement('div');
    allChip.className = 'chip' + (activeCategory===null ? ' active':'');
    allChip.textContent = 'All';
    allChip.onclick = function(){ activeCategory=null; renderChips(); renderList(); };
    row.appendChild(allChip);
    cats.forEach(function(c){

  var FMT_TAGS = {
    bold: ['**','**'],
    italic: ['*','*'],
    highlight: ['==','=='],
    red: ['{{red:','}}'],
    green: ['{{green:','}}'],
    blue: ['{{blue:','}}']
  };
  function applyFormat(textarea, blockObj, fmt){
    var tag = FMT_TAGS[fmt];
    if(!tag) return;
    var prefix = tag[0], suffix = tag[1];
    var start = textarea.selectionStart, end = textarea.selectionEnd;
    var value = textarea.value;
    var selected = value.slice(start, end);
    var placeholder = selected || 'text';
    var newValue = value.slice(0,start) + prefix + placeholder + suffix + value.slice(end);
    textarea.value = newValue;
    blockObj.text = newValue;
    textarea.focus();
    var selStart = start + prefix.length;
    textarea.setSelectionRange(selStart, selStart + placeholder.length);
  }
  function renderInlineFormatting(text){
    var out = escapeHtml(text);
    out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
    out = out.replace(/==(.+?)==/g, '<mark>$1</mark>');
    out = out.replace(/\{\{red:(.+?)\}\}/g, '<span style="color:#A8492E;font-weight:600;">$1</span>');
    out = out.replace(/\{\{green:(.+?)\}\}/g, '<span style="color:#4F6B49;font-weight:600;">$1</span>');
    out = out.replace(/\{\{blue:(.+?)\}\}/g, '<span style="color:#3B6E8F;font-weight:600;">$1</span>');
    return out;
  }
  function setBlockImage(b, file){
    if(!file.type || file.type.indexOf('image/')!==0) return;
    b.blob = file;
    b.filename = null;
    b.previewUrl = URL.createObjectURL(file);
    renderBlocks();
  }
  function setBlockVideo(b, file){
    if(!file.type || file.type.indexOf('video/')!==0) return;
    b.blob = file;
    b.filename = null;
    b.previewUrl = URL.createObjectURL(file);
    renderBlocks();
  }

  /* ---------- Serialize / parse notes.txt body ---------- */
  function serializeBlocks(blockList){
    var lines = [];
    blockList.forEach(function(b){
      if(b.type==='heading'){ lines.push('## ' + (b.text||'')); }
      else if(b.type==='text'){ lines.push(b.text||''); }
      else if(b.type==='image'){
        lines.push('[IMAGE: ' + b.filename + ']');
        if(b.caption){ lines.push('Caption: ' + b.caption); }
      }
      else if(b.type==='video'){
        lines.push('[VIDEO: ' + b.filename + ']');
        if(b.caption){ lines.push('Caption: ' + b.caption); }
      }
      lines.push('');
    });
    return lines.join('\n').trim() + '\n';
  }
  function parseBlocksFromBody(bodyText){
    var lines = (bodyText||'').split('\n');
    var out = [];
    var i = 0;
    while(i < lines.length){
      var line = lines[i];
      if(line.indexOf('## ') === 0){
        out.push({type:'heading', text: line.slice(3)}); i++; continue;
      }
      if(line.indexOf('[IMAGE: ') === 0 && line.trim().slice(-1) === ']'){
        var fname = line.trim().slice(8, -1);
        i++;
        var caption = '';
        if(lines[i] && lines[i].indexOf('Caption: ') === 0){ caption = lines[i].slice(9); i++; }
        out.push({type:'image', filename: fname, caption: caption});
        continue;
      }
      if(line.indexOf('[VIDEO: ') === 0 && line.trim().slice(-1) === ']'){
        var vname = line.trim().slice(8, -1);
        i++;
        var vcaption = '';
        if(lines[i] && lines[i].indexOf('Caption: ') === 0){ vcaption = lines[i].slice(9); i++; }
        out.push({type:'video', filename: vname, caption: vcaption});
        continue;
      }
      if(line.trim() === ''){ i++; continue; }
      var textLines = [];
      while(i < lines.length && lines[i].trim() !== '' && lines[i].indexOf('## ') !== 0 && lines[i].indexOf('[IMAGE: ') !== 0 && lines[i].indexOf('[VIDEO: ') !== 0){
        textLines.push(lines[i]); i++;
      }
      out.push({type:'text', text: textLines.join('\n')});
    }
    return out;
  }
  function flattenForSnippet(blockList){
    return flattenAll(blockList).slice(0,220);
  }
  function flattenAll(blockList){
    return blockList.filter(function(b){ return b.type==='heading' || b.type==='text'; })
      .map(function(b){ return b.text; }).join(' ').trim();
  }

  /* ---------- Editor open/save ---------- */
  function parseBody(notesText){
    var idx = notesText.indexOf('\n---\n');
    if(idx === -1) return notesText;
    return notesText.slice(idx + 5);
  }
  async function openEditor(entry, isDuplicate){
    blocks.forEach(function(b){ if(b.previewUrl) URL.revokeObjectURL(b.previewUrl); });
    blocks = [];
    editingOldFiles = [];
    document.getElementById('editId').value = (entry && !isDuplicate) ? entry.id : '';
    document.getElementById('editorTitle').textContent = isDuplicate ? 'New Entry (from duplicate)' : (entry ? 'Edit Entry' : 'New Entry');
    document.getElementById('fTitle').value = entry ? (isDuplicate ? entry.title + ' (Copy)' : entry.title) : '';
    document.getElementById('fCategory').value = entry ? entry.category : 'General Liability';
    document.getElementById('fKeywords').value = entry ? (entry.keywords||[]).join(', ') : '';
    document.getElementById('deleteBtn').style.display = (entry && !isDuplicate) ? 'inline-block' : 'none';
    document.getElementById('editorOverlay').classList.add('show');
    renderBlocks();

    if(entry){
      var folderHandle = await dirHandle.getDirectoryHandle(entry.folder, {create:false}).catch(function(){return null;});
      if(folderHandle){
        var notesText = '';
        try{
          var nfh = await folderHandle.getFileHandle('notes.txt', {create:false});
          var nfile = await nfh.getFile();
          notesText = await nfile.text();
        }catch(e){}
        var parsed = parseBlocksFromBody(parseBody(notesText));
        for(var i=0;i<parsed.length;i++){
          var pb = parsed[i];
          if(pb.type === 'image' || pb.type === 'video'){
            if(!isDuplicate){ editingOldFiles.push(pb.filename); }
            var previewUrl = null, blob = null;
            try{
              var ifh = await folderHandle.getFileHandle(pb.filename, {create:false});
              var ifile = await ifh.getFile();
              blob = ifile;
              previewUrl = URL.createObjectURL(ifile);
            }catch(e){}
            blocks.push({id:uid(), type:pb.type, text:'', caption: pb.caption||'', blob: blob, filename: isDuplicate ? null : pb.filename, previewUrl: previewUrl});
          } else {
            blocks.push({id:uid(), type:pb.type, text: pb.text||'', caption:'', blob:null, filename:null, previewUrl:null});
          }
        }
        renderBlocks();
      }
    }
    document.getElementById('fTitle').focus();
  }
  function closeEditor(){ document.getElementById('editorOverlay').classList.remove('show'); }

  async function saveCurrentEntry(){
    var id = document.getElementById('editId').value;
    var title = document.getElementById('fTitle').value.trim();
    if(!title){ document.getElementById('fTitle').focus(); return; }
    var category = document.getElementById('fCategory').value;
    var keywords = document.getElementById('fKeywords').value.split(',')
      .map(function(k){return k.trim();}).filter(function(k){return k.length;});
    var now = Date.now();

    var saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

    var permOk = await ensurePermission(dirHandle, true);
    if(!permOk){
      alert('Field Book lost write access to your folder. Please use "Change folder" and reselect it, then try saving again.');
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      return;
    }

    try{
      var isNew = !id;
      var entryId = id || uid();
      var folderName = isNew ? (slugify(title) + '-' + entryId.slice(-6)) : entries.find(function(x){return x.id===id;}).folder;
      var folderHandle = await dirHandle.getDirectoryHandle(folderName, {create:true});

      for(var k=0;k<editingOldFiles.length;k++){
        try{ await folderHandle.removeEntry(editingOldFiles[k]); }catch(e){}
      }

      var imageBlockIdx = 0;
      var videoBlockIdx = 0;
      var imageCount = 0;
      var videoCount = 0;
      for(var j=0;j<blocks.length;j++){
        if(blocks[j].type === 'image' && blocks[j].blob){
          imageBlockIdx++;
          var fname = 'screenshot-' + imageBlockIdx + '.' + extFor(blocks[j].blob, 'png');
          var fh = await folderHandle.getFileHandle(fname, {create:true});
          var w = await fh.createWritable();
          await w.write(blocks[j].blob);
          await w.close();
          blocks[j].filename = fname;
          imageCount++;
        } else if(blocks[j].type === 'video' && blocks[j].blob){
          videoBlockIdx++;
          var vfname = 'clip-' + videoBlockIdx + '.' + extFor(blocks[j].blob, 'mp4');
          var vfh = await folderHandle.getFileHandle(vfname, {create:true});
          var vw = await vfh.createWritable();
          await vw.write(blocks[j].blob);
          await vw.close();
          blocks[j].filename = vfname;
          videoCount++;
        }
      }

      var validBlocks = blocks.filter(function(b){
        if(b.type==='image' || b.type==='video') return !!b.filename;
        return true;
      });
      var bodyText = serializeBlocks(validBlocks);

      var createdAt = isNew ? now : entries.find(function(x){return x.id===id;}).createdAt;
      var notesContent = 'Title: ' + title + '\nCategory: ' + category + '\nKeywords: ' + keywords.join(', ') +
        '\nCreated: ' + new Date(createdAt).toISOString() + '\nUpdated: ' + new Date(now).toISOString() +
        '\n---\n' + bodyText;
      var notesFh = await folderHandle.getFileHandle('notes.txt', {create:true});
      var notesW = await notesFh.createWritable();
      await notesW.write(notesContent);
      await notesW.close();

      var snippet = flattenForSnippet(validBlocks);
      var searchText = flattenAll(validBlocks);
      var existing = isNew ? null : entries.find(function(x){return x.id===id;});
      var meta = {
        id: entryId, title: title, category: category, keywords: keywords,
        folder: folderName, snippet: snippet, searchText: searchText, imageCount: imageCount, videoCount: videoCount,
        pinned: existing ? !!existing.pinned : false,
        createdAt: createdAt, updatedAt: now
      };
      if(isNew){ entries.push(meta); }
      else { var idxPos = entries.findIndex(function(x){return x.id===id;}); entries[idxPos] = meta; }

      await writeIndex();
      closeEditor();
      renderChips();
      renderList();
    }catch(e){
      console.error('Field Book save error:', e);
      alert('Could not save: ' + (e && e.message ? e.message : e) + '\n\nIf this keeps happening, check that the entry\'s folder still exists inside your chosen Field Book folder and hasn\'t been renamed or moved.');
    }finally{
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
    }
  }

  async function deleteEntryById(id){
    var e = entries.find(function(x){return x.id===id;});
    if(!e) return;
    try{ await dirHandle.removeEntry(e.folder, {recursive:true}); }catch(err){}
    entries = entries.filter(function(x){return x.id!==id;});
    await writeIndex();
    renderChips();
    renderList();
  }

  /* ---------- Detail ---------- */
  async function openDetail(id){
    var e = entries.find(function(x){return x.id===id;});
    if(!e) return;
    currentDetailId = id;
    currentDetailObjectUrls.forEach(function(u){ URL.revokeObjectURL(u); });
    currentDetailObjectUrls = [];

    document.getElementById('dTitle').textContent = e.title;
    document.getElementById('dCategory').innerHTML = e.category ? (catDot(e.category) + escapeHtml(e.category)) : '';
    document.getElementById('dKeywords').textContent = (e.keywords&&e.keywords.length) ? e.keywords.join(' · ') : '';
    document.getElementById('dBody').innerHTML = '<p>Loading…</p>';
    document.getElementById('dMeta').textContent = 'Created ' + fmtDate(e.createdAt) + '  ·  Updated ' + fmtDate(e.updatedAt);
    document.getElementById('dPinBtn').textContent = e.pinned ? '★ Unpin' : '☆ Pin';
    document.getElementById('detailOverlay').classList.add('show');

    try{
      var folderHandle = await dirHandle.getDirectoryHandle(e.folder, {create:false});
      var nfh = await folderHandle.getFileHandle('notes.txt', {create:false});
      var nfile = await nfh.getFile();
      var text = await nfile.text();
      var parsed = parseBlocksFromBody(parseBody(text));

      var html = '';
      for(var i=0;i<parsed.length;i++){
        var b = parsed[i];
        if(b.type==='heading'){
          html += '<h3>'+escapeHtml(b.text)+'</h3>';
        } else if(b.type==='text'){
          html += '<p>'+renderInlineFormatting(b.text)+'</p>';
        } else if(b.type==='image'){
          try{
            var ifh = await folderHandle.getFileHandle(b.filename, {create:false});
            var ifile = await ifh.getFile();
            var url = URL.createObjectURL(ifile);
            currentDetailObjectUrls.push(url);
            html += '<figure><img src="'+url+'" data-src="'+url+'">' +
              (b.caption ? '<figcaption>'+escapeHtml(b.caption)+'</figcaption>' : '') + '</figure>';
          }catch(e){}
        } else if(b.type==='video'){
          try{
            var vfh2 = await folderHandle.getFileHandle(b.filename, {create:false});
            var vfile2 = await vfh2.getFile();
            var vurl = URL.createObjectURL(vfile2);
            currentDetailObjectUrls.push(vurl);
            html += '<figure><video src="'+vurl+'" controls></video>' +
              (b.caption ? '<figcaption>'+escapeHtml(b.caption)+'</figcaption>' : '') + '</figure>';
          }catch(e){}
        }
      }
      if(!html) html = '<p style="color:var(--ink-soft);">No content in this entry yet.</p>';
      document.getElementById('dBody').innerHTML = html;
      Array.prototype.forEach.call(document.getElementById('dBody').querySelectorAll('img'), function(img){
        img.onclick = function(){ showLightbox(this.src); };
      });
    }catch(err){
      document.getElementById('dBody').innerHTML = '<p>Could not read this entry\'s folder. It may have been moved or renamed outside the app.</p>';
    }
  }
  function closeDetail(){ document.getElementById('detailOverlay').classList.remove('show'); currentDetailId = null; }

  function showLightbox(src){
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('show');
  }
  function hideLightbox(){
    document.getElementById('lightbox').classList.remove('show');
    document.getElementById('lightboxImg').src='';
  }

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem(THEME_KEY, t);
  }

  /* ---------- Static wiring ---------- */
  document.getElementById('cancelBtn').onclick = closeEditor;
  document.getElementById('saveBtn').onclick = saveCurrentEntry;
  document.getElementById('addHeadingBtn').onclick = function(){ addBlock('heading'); };
  document.getElementById('addTextBtn').onclick = function(){ addBlock('text'); };
  document.getElementById('addImageBtn').onclick = function(){ addBlock('image'); };
  document.getElementById('addVideoBtn').onclick = function(){ addBlock('video'); };
  document.getElementById('deleteBtn').onclick = function(){
    var id = document.getElementById('editId').value;
    if(id && confirm('Delete this entry and its folder? This can\'t be undone.')){
      deleteEntryById(id);
      closeEditor();
    }
  };
  document.getElementById('closeDetailBtn').onclick = closeDetail;
  document.getElementById('dEditBtn').onclick = function(){
    var e = entries.find(function(x){return x.id===currentDetailId;});
    closeDetail();
    openEditor(e);
  };
  document.getElementById('dDuplicateBtn').onclick = function(){
    var e = entries.find(function(x){return x.id===currentDetailId;});
    closeDetail();
    openEditor(e, true);
  };
  document.getElementById('dPinBtn').onclick = function(){
    if(currentDetailId){ togglePin(currentDetailId); }
  };
  document.getElementById('dDeleteBtn').onclick = function(){
    if(currentDetailId && confirm('Delete this entry and its folder? This can\'t be undone.')){
      deleteEntryById(currentDetailId);
      closeDetail();
    }
  };
  document.getElementById('themeBtn').onclick = function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(cur);
  };

  document.getElementById('lightbox').onclick = hideLightbox;
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ hideLightbox(); closeDetail(); closeEditor(); }
  });
  document.getElementById('editorOverlay').addEventListener('mousedown', function(e){ if(e.target===this) closeEditor(); });
  document.getElementById('detailOverlay').addEventListener('mousedown', function(e){ if(e.target===this) closeDetail(); });

  /* ---------- Init ---------- */
  async function init(){
    applyTheme(localStorage.getItem(THEME_KEY) || 'light');
    if(!('showDirectoryPicker' in window)){ showUnsupported(); return; }
    var handle = await idbGet('root').catch(function(){return null;});
    if(handle){
      var ok = await ensurePermission(handle, false);
      if(ok){ dirHandle = handle; await afterConnect(); }
      else { showReconnectPrompt(handle); }
    } else {
      showConnectPrompt();
    }
  }
  init();
})();
</script>
</body>
</html>
